services:
  - type: web
    name: credtrace-phase1
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn credtrace_phase1:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: COMPANY_PASSWORD
        sync: false
      - key: APP_SECRET
        generateValue: true
